name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Verify import
        run: python -c "from devmind.cli import app; print('Import OK')"

      - name: Test devmind doctor
        run: devmind doctor 2>&1 | head -5

      - name: Test devmind snapshot
        run: devmind snapshot 2>&1 | head -5

      - name: Test devmind explain
        run: devmind explain --list 2>&1 | head -5

      - name: Test devmind forecast
        run: devmind forecast --help 2>&1 | head -3

      - name: Test devmind optimize
        run: devmind optimize --help 2>&1 | head -3

      - name: Test devmind llm-benchmark
        run: devmind llm-benchmark --help 2>&1 | head -3

      - name: Test devmind history
        run: devmind history --help 2>&1 | head -3

      - name: Test devmind compare
        run: devmind compare --help 2>&1 | head -3
